<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08070d">
  <meta name="robots" content="noindex,nofollow">
  <title>Paroglu Media — Yönetim Paneli</title>
  <link rel="icon" type="image/png" href="favicon-32.png">
  <link rel="stylesheet" href="admin.css?v=13.1">
</head>
<body>
  <div class="admin-noise"></div>
  <section class="login-shell" id="loginView" hidden>
    <div class="login-card">
      <img src="paroglu-media-logo-light.png" alt="Paroglu Media" class="login-logo">
      <div class="login-kicker">YÖNETİM PANELİ / V14</div>
      <h1>İçerik kontrolü<br><em>tek yerde.</em></h1>
      <p>Portfolyo, markalar, site metinleri, medya ve gelen proje talepleri.</p>
      <form id="loginForm" class="login-form">
        <label>E-posta<input id="loginEmail" type="email" autocomplete="username" value="umutparoglu87@gmail.com" required></label>
        <label>Şifre<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Supabase admin şifren"></label>
        <button type="submit" class="primary">Giriş Yap ↗</button>
        <div class="form-message" id="loginMessage"></div>
      </form>
    </div>
  </section>

  <section class="admin-app" id="adminApp" hidden>
    <aside class="sidebar">
      <a class="sidebar-brand" href="index.html" target="_blank" rel="noopener"><img src="paroglu-media-logo-light.png" alt="Paroglu Media"></a>
      <nav id="adminNav">
        <button class="nav-item active" data-view="dashboard"><span>✦</span> Genel Bakış</button>
        <button class="nav-item" data-view="content"><span>Aa</span> Site İçerikleri</button>
        <button class="nav-item" data-view="projects"><span>▦</span> Portfolyo</button>
        <button class="nav-item" data-view="brands"><span>◌</span> Markalar</button>
        <button class="nav-item" data-view="media"><span>▧</span> Medya</button>
        <button class="nav-item" data-view="briefs"><span>↳</span> Talepler</button>
      </nav>
      <div class="sidebar-foot">
        <a href="index.html" target="_blank" rel="noopener">Siteyi Aç ↗</a>
        <button id="logoutBtn">Çıkış</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div><small>PAROGLU MEDIA / CMS</small><h2 id="viewTitle">Genel Bakış</h2></div>
        <div class="topbar-actions"><span class="live-dot"><i></i> Supabase bağlı</span><button class="mobile-nav-toggle" id="mobileNavToggle">Menü</button></div>
      </header>
      <div class="toast" id="toast"></div>
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-content"></section>
      <section class="view" id="view-projects"></section>
      <section class="view" id="view-brands"></section>
      <section class="view" id="view-media"></section>
      <section class="view" id="view-briefs"></section>
    </main>
  </section>

  <dialog class="admin-dialog" id="editorDialog"><div class="dialog-shell"><div class="dialog-head"><div><small id="dialogKicker">DÜZENLE</small><h3 id="dialogTitle">Kayıt</h3></div><button type="button" id="dialogClose">×</button></div><form id="editorForm" class="editor-form"></form></div></dialog>

  <script src="backend-config.js?v=13"></script>
  <script src="admin-panel.js?v=13.1"></script>
</body>
</html>
